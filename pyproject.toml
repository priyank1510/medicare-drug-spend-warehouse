[project]
name = "drugspend"
version = "1.0.0"
description = "Medicare Part D drug spend warehouse: contract-driven ingestion, dbt star schema, SCD2, data quality."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "e2e: runs the full pipeline (needs duckdb + dbt installed)",
]
